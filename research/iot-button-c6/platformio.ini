; Diagnostic firmware for the Seeed IoT Button V2 (ESP32-C6FH4, 4 MB flash).
; Separate from voistic: Arduino core 3 comes from pioarduino's platform.
;
;   pio run -t upload --upload-port /dev/cu.usbmodem14301
;   pio device monitor

[env:button]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
board_build.flash_mode = dio  ; what the factory image uses
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
