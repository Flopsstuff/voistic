name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/version.py reads the tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini', 'sdkconfig.c6.defaults') }}
      - run: pip install platformio
      # The c6 build compiles ESP-IDF, then calls pioarduino's own copy of
      # PlatformIO in ~/.platformio/penv. That one says 6.2.0.post1, which the
      # platform counts as older than its minimum of 6.2.0, so it removes itself.
      # Installing the platform creates that copy, and 6.2.0 replaces it.
      - name: Pin the PlatformIO that the c6 build calls
        run: |
          pio pkg install -e c6
          penv="$HOME/.platformio/penv/bin"
          "$penv/uv" pip install --python "$penv/python" "platformio==6.2.0" ||
            "$penv/python" -m pip install "platformio==6.2.0"
          "$penv/pio" --version

      - name: Build the server
        run: make -C server dist VERSION="$GITHUB_REF_NAME"
      - name: Build the firmware
        run: |
          pio run -e usb -e mic -e c6
          cp .pio/build/usb/firmware.bin server/dist/firmware-xiao-s3.bin
          cp .pio/build/mic/firmware.bin server/dist/firmware-xiao-s3-mic.bin
          cp .pio/build/c6/firmware.bin server/dist/firmware-iot-button-c6.bin
      - name: Sum the files
        working-directory: server/dist
        run: sha256sum -- * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" server/dist/* --verify-tag --generate-notes
