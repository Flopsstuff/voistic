name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/version.py reads the tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini', 'sdkconfig.c6.defaults') }}
      - run: pip install platformio
      # The c6 build compiles ESP-IDF, then calls pioarduino's own copy of
      # PlatformIO in ~/.platformio/penv. That one says 6.2.0.post1, which the
      # platform counts as older than its minimum of 6.2.0, so it removes itself.
      # Installing the platform creates that copy, and 6.2.0 replaces it.
      - name: Pin the PlatformIO that the c6 build calls
        run: |
          pio pkg install -e c6
          penv="$HOME/.platformio/penv/bin"
          "$penv/uv" pip install --python "$penv/python" "platformio==6.2.0" ||
            "$penv/python" -m pip install "platformio==6.2.0"
          "$penv/pio" --version
      - run: pio test -e native
      # c6 rebuilds ESP-IDF, minutes the first time, then cached with ~/.platformio
      - run: pio run -e usb -e mic -e c6
