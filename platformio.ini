; voistic firmware. Every board builds with pioarduino's platform, the only one
; with Arduino core 3, which the ESP32-C6 needs. It's pinned to a release, so a
; build stays the same.
;
;   usb  Seeed XIAO ESP32S3 Plus + Adafruit IoT Button with NeoPixel BFF
;   mic  the same with an SPH0645 microphone
;   c6   Seeed IoT Button V2 with a DFRobot SEN0487 microphone
;
;   pio run -e mic -t upload   flash over USB (the board must be awake)
;   pio test -e native         run the gesture tests on this computer

[platformio]
default_envs = usb

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

[env:usb]
platform = ${esp32.platform}
board = seeed_xiao_esp32_s3_plus
framework = arduino

board_build.partitions = default_16MB.csv

monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel
extra_scripts = pre:scripts/version.py
test_ignore = *

[env:native]
platform = native
build_src_filter = -<*> +<gesture.cpp>
test_build_src = yes
build_flags = -std=gnu++17

; The same button with an SPH0645 microphone, which streams the voice while held.
[env:mic]
extends = env:usb
build_flags = -DVOISTIC_MIC

; Seeed IoT Button V2 (ESP32-C6FH4, 4 MB flash, no PSRAM) with an analog
; DFRobot SEN0487 microphone on its test pads, see research/iot-button-c6.
[env:c6]
platform = ${esp32.platform}
board = esp32-c6-devkitm-1
framework = arduino
board_build.flash_mode = dio  ; as the factory image
board_build.partitions = partitions-c6.csv  ; Arduino's min_spiffs: two 1.9 MB app slots for updates
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
test_ignore = *
; Arduino's own build of ESP-IDF has no power management and checks a DHCP
; address for a second, so it's rebuilt with the settings in this file. The
; first build downloads ESP-IDF and takes a few minutes.
custom_sdkconfig = file://sdkconfig.c6.defaults
build_flags =
  -DVOISTIC_BOARD_C6
  -DVOISTIC_MIC
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
