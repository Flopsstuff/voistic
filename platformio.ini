; Seeed Studio XIAO ESP32S3 Plus + Adafruit IoT Button with NeoPixel BFF.
; PlatformIO has no dedicated Plus board, so the plain XIAO S3 definition is
; used with the flash size overridden to the Plus's 16 MB.
;
;   pio run -t upload    flash over USB (the board must be awake)
;   pio test -e native   run the gesture tests on this computer

[platformio]
default_envs = usb

[env:usb]
; Pinned, since newer platforms bring Arduino core 3, which has no MDNS.IP.
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel
extra_scripts = pre:scripts/version.py
test_ignore = *

[env:native]
platform = native
build_src_filter = -<*> +<gesture.cpp>
test_build_src = yes
build_flags = -std=gnu++17

; The same button with an SPH0645 microphone, which streams the voice while held.
[env:mic]
extends = env:usb
build_flags = -DVOISTIC_MIC
